name: MODEL H Recalibration V2

on:
  pull_request:
    branches: [migration/binance-usdm]
    paths:
      - "bot/market_language.py"
      - "bot/model_h_oos_evidence.py"
      - "bot/model_h_recalibration_v2.py"
      - "tests/test_market_language.py"
      - "tests/test_model_h_oos_evidence.py"
      - "tests/test_model_h_recalibration_v2.py"
      - ".github/workflows/model_h_recalibration_v2.yml"
  workflow_dispatch:

jobs:
  recalibration:
    name: Nested walk-forward MODEL H
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_TRADE: "true"
      LIVE_TRADING_CONFIRMED: ""
      NEXUS_PILOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Recalibration unit tests
        run: |
          python -m unittest tests.test_market_language -v
          python -m unittest tests.test_model_h_oos_evidence -v
          python -m unittest tests.test_model_h_recalibration_v2 -v
      - name: Nested walk-forward recalibration
        run: |
          python -m bot.model_h_recalibration_v2 \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT \
            --limit-15m 2200 --tune-step 16 --test-step 8 \
            --output artifacts/model_h_recalibration_v2.json
      - name: Show frozen test evidence
        if: always()
        run: |
          test -f artifacts/model_h_recalibration_v2.json && cat artifacts/model_h_recalibration_v2.json || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-h-recalibration-v2
          path: artifacts/model_h_recalibration_v2.json
          if-no-files-found: error
