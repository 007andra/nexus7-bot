# BGX Capital — Verificação de qualidade em cada push
#
# Quality gate for main and pull requests. Railway deployment gating is a
# separate repository/deployment setting and must not be inferred from this file.
# Detecta a classe de erro que historicamente passou despercebida:
# NameError/AttributeError latentes engolidos por except genérico.

name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    # migration/binance-usdm is the Binance USD-M production branch; PRs into it
    # must run the same gates as PRs into main.
    branches: [main, migration/binance-usdm]

jobs:
  check:
    name: Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proof
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus_release_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proof -d nexus_release_proof"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://proof:postgres@127.0.0.1:5432/nexus_release_proof
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Exact candidate SHA attestation
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "[SHA_ATTESTATION]"
          echo "expected_candidate_sha=$EXPECTED_CANDIDATE_SHA"
          echo "event_sha=$EVENT_SHA"
          echo "pr_head_sha=$PR_HEAD_SHA"
          echo "checked_out_sha=$CHECKED_OUT_SHA"
          test "$CHECKED_OUT_SHA" = "$EXPECTED_CANDIDATE_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes ruff
          pip install -r requirements.txt

      - name: Consistência de dependências instaladas
        run: python -m pip check

      - name: Compilação (erros de sintaxe)
        run: python -m compileall -q bot/ tests/ main.py main_hardened.py

      - name: Ruff — falhas estáticas críticas
        # E9/F63/F7/F82: syntax/runtime-invalid constructs, undefined names,
        # invalid control flow and import/export errors. This is intentionally
        # narrow so the gate catches correctness defects without turning a
        # style migration into a production blocker.
        run: ruff check bot/ tests/ main.py main_hardened.py --select E9,F63,F7,F82

      - name: Pyflakes — nomes indefinidos
        run: |
          OUT=$(python -m pyflakes bot/ main.py main_hardened.py 2>&1 || true)
          echo "$OUT"
          UNDEF=$(echo "$OUT" | grep -c "undefined name" || true)
          if [ "$UNDEF" -gt 0 ]; then
            echo "::error::$UNDEF nome(s) indefinido(s) — NameError garantido em runtime"
            echo "$OUT" | grep "undefined name"
            exit 1
          fi

      - name: Self-check de integridade
        run: python -m bot.selfcheck

      - name: Startup self-check fail-closed
        run: python -m unittest tests.test_startup_selfcheck_fail_closed -v

      - name: Startup hardenings fail-closed
        run: python -m unittest tests.test_sitecustomize_fail_closed -v

      - name: Pretrade market data fail-closed
        run: python -m unittest tests.test_pretrade_fail_closed -v

      - name: Configured leverage is immutable at dispatch
        run: python -m unittest tests.test_leverage_no_fallback -v

      - name: Full offline test suite
        run: python -m tests.run_offline

      - name: Final pre-release proof pack
        run: python -m bot.release_proof

      - name: Explicit XRP BGX-MISSED-001 proof pack
        run: |
          python -m unittest -v \
            tests.test_protection_readiness_authority.ProtectionReadinessAuthorityTests.test_xrp_candidate_proceeds_after_sol_confirmed_flat_reconciliation \
            tests.test_protection_readiness_authority.ProtectionReadinessAuthorityTests.test_xrp_candidate_remains_blocked_when_sol_is_genuinely_unprotected \
            tests.test_protection_readiness_authority.ProtectionReadinessAuthorityTests.test_xrp_race_blocks_while_sol_unknown_then_allows_new_candidate_after_reconciliation

      - name: Deterministic PAPER and SHADOW E2E safety pack
        run: |
          python -m unittest tests.test_shadow_post_ai_chain -v
          python -m unittest tests.test_paper_mutations -v
          python -m unittest tests.test_paper_signal_exit_idempotency -v
          python -m unittest tests.test_paper_wallet_restart -v
          python -m unittest tests.test_e2e_validation_contract -v

      - name: Critical safety regressions execute non-zero tests
        run: |
          python -m tests.run_offline \
            tests.test_liquidation_override_guard \
            tests.test_balance_observability \
            tests.test_news_context_hardening \
            tests.test_scan_summary_hardening

      - name: PAPER wallet restart persistence
        run: python -m unittest tests.test_paper_wallet_restart -v

      - name: NEXUS zero-veto diagnostics
        run: python -m unittest tests.test_nexus_zero_observability -v

      - name: NEXUS OOS incremental-edge evidence gate
        run: python -m unittest tests.test_nexus_oos_edge_gate -v

      - name: NEXUS OOS replay evidence dataset contract
        run: python -m unittest tests.test_nexus_oos_evidence_dataset -v

      - name: RR precision config isolation
        run: python -m unittest tests.test_rr_precision_isolation -v

      - name: PAPER projected loss budget
        run: python -m unittest tests.test_paper_loss_budget -v

      - name: Durable execution restart and idempotency
        run: python -m unittest tests.test_durable_execution_restart -v

      - name: Durable intent before dispatch
        run: python -m unittest tests.test_durable_dispatch_gate -v

      - name: Durable startup reconciliation hardening
        run: python -m unittest tests.test_durable_reconcile_hardening -v

      - name: Atomic PAPER database state
        run: python -m unittest tests.test_database_atomic_paper -v

      - name: LIVE adapter chaos safety pack
        run: python -m unittest tests.test_live_adapter_chaos -v

      - name: KuCoin native TPSL protected-entry safety pack
        run: python -m unittest tests.test_kucoin_native_tpsl -v

      - name: KuCoin fill multiplier normalization safety pack
        run: python -m unittest tests.test_kucoin_fill_normalization -v

      - name: Hardened entrypoint imports with unified thresholds
        env:
          PAPER_TRADE: "true"
          MIN_ENTRY_SCORE: "65"
          NEXUS_MIN_SCORE: "65"
        run: python -c "import main_hardened; print('hardened entrypoint ok')"

      - name: Hardened entrypoint fails closed on score drift
        env:
          PAPER_TRADE: "true"
          MIN_ENTRY_SCORE: "65"
          NEXUS_MIN_SCORE: "55"
        run: |
          if python -c "import main_hardened"; then
            echo "::error::score threshold drift was not blocked"
            exit 1
          fi

      - name: Imports em runtime
        run: |
          python - <<'EOF'
          import os, sys, importlib
          sys.path.insert(0, ".")
          falhas = []
          for f in sorted(os.listdir("bot")):
              if f.endswith(".py") and f != "__init__.py":
                  m = "bot." + f[:-3]
                  try:
                      importlib.import_module(m)
                  except Exception as e:
                      falhas.append(f"{m}: {type(e).__name__}: {e}")
          try:
              importlib.import_module("main")
          except Exception as e:
              falhas.append(f"main: {type(e).__name__}: {e}")
          if falhas:
              for x in falhas:
                  print(f"::error::{x}")
              sys.exit(1)
          print("Todos os módulos importam corretamente")
          EOF
