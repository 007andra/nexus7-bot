name: MODEL H V3 Transfer Evidence

on:
  pull_request:
    branches: [migration/binance-usdm]
    paths:
      - "bot/model_h_v3.py"
      - "tests/test_model_h_v3.py"
      - ".github/workflows/model_h_v3_evidence.yml"
      - "docs/model_h_v3.md"
  workflow_dispatch:

jobs:
  evidence:
    name: Multiscale analog unseen-symbol holdout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_TRADE: "true"
      LIVE_TRADING_CONFIRMED: ""
      NEXUS_PILOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: V3 causality and isolation tests
        run: |
          python -m unittest tests.test_model_h_v3 -v
      - name: Run V3 development selection and unseen-symbol transfer holdout
        run: |
          python -m bot.model_h_v3 \
            --limit-15m 1800 --tune-step 32 --holdout-step 16 \
            --output artifacts/model_h_v3_evidence.json
      - name: Show V3 evidence
        if: always()
        run: |
          test -f artifacts/model_h_v3_evidence.json && cat artifacts/model_h_v3_evidence.json || true
      - name: Upload V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-h-v3-evidence
          path: artifacts/model_h_v3_evidence.json
          if-no-files-found: error
