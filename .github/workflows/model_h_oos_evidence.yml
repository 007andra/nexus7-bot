name: MODEL H OOS Evidence

on:
  pull_request:
    branches: [migration/binance-usdm]
    paths:
      - "bot/market_language.py"
      - "bot/model_h_oos_evidence.py"
      - "tests/test_market_language.py"
      - "tests/test_model_h_oos_evidence.py"
      - ".github/workflows/model_h_oos_evidence.yml"
  workflow_dispatch:

jobs:
  evidence:
    name: MODEL H public historical OOS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_TRADE: "true"
      LIVE_TRADING_CONFIRMED: ""
      NEXUS_PILOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run MODEL H evidence tests
        run: |
          python -m unittest tests.test_market_language -v
          python -m unittest tests.test_model_h_oos_evidence -v
      - name: Run public historical OOS evidence
        run: |
          python -m bot.model_h_oos_evidence \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT \
            --limit-15m 2500 --horizon 4 --step 4 \
            --output artifacts/model_h_oos_evidence.json
      - name: Show evidence
        if: always()
        run: |
          test -f artifacts/model_h_oos_evidence.json && cat artifacts/model_h_oos_evidence.json || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-h-oos-evidence
          path: artifacts/model_h_oos_evidence.json
          if-no-files-found: error
