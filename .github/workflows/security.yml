name: Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    # migration/binance-usdm is the Binance USD-M production branch; PRs into it
    # must run the same gates as PRs into main.
    branches: [main, migration/binance-usdm]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Dependency, source, secrets and SBOM audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Exact candidate SHA attestation
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "[SHA_ATTESTATION]"
          echo "expected_candidate_sha=$EXPECTED_CANDIDATE_SHA"
          echo "event_sha=$EVENT_SHA"
          echo "pr_head_sha=$PR_HEAD_SHA"
          echo "checked_out_sha=$CHECKED_OUT_SHA"
          test "$CHECKED_OUT_SHA" = "$EXPECTED_CANDIDATE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install project and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit cyclonedx-bom bandit
      - name: Audit Python dependency vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Static security scan — HIGH severity gate
        # B324 is intentionally excluded: the two MD5 uses in this repository
        # are deterministic non-security identifiers (clientOid/news dedupe),
        # not cryptographic authentication, signatures, passwords or secrets.
        # Dependency CVEs remain zero-tolerance through pip-audit above.
        run: bandit -r bot main.py main_hardened.py -lll -s B324
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: nexus7-sbom
          path: sbom.cdx.json
          if-no-files-found: error
