name: NEXUS Real OOS Replay

on:
  pull_request:
    # migration/binance-usdm is the Binance USD-M production branch; PRs into it
    # must run the same gates as PRs into main.
    branches: [main, migration/binance-usdm]
    paths:
      - "bot/nexus_oos_edge_gate.py"
      - "bot/nexus_oos_real_replay.py"
      - "bot/nexus_oos_real_replay_corrected.py"
      - "bot/nexus_oos_robustness.py"
      - "bot/nexus_oos_robustness_replay.py"
      - "tests/test_nexus_oos_edge_gate.py"
      - "tests/test_nexus_oos_real_replay.py"
      - "tests/test_nexus_oos_replay_full_clock.py"
      - "tests/test_nexus_oos_robustness.py"
      - ".github/workflows/oos_real_replay.yml"
  workflow_dispatch:

jobs:
  replay:
    name: Real historical replay evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_TRADE: "true"
      LIVE_TRADING_CONFIRMED: ""
      NEXUS_PILOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Replay accounting, clock-parity and robustness unit tests
        run: |
          python -m unittest tests.test_nexus_oos_edge_gate -v
          python -m unittest tests.test_nexus_oos_real_replay -v
          python -m unittest tests.test_nexus_oos_replay_full_clock -v
          python -m unittest tests.test_nexus_oos_robustness -v

      - name: Run real public-market OOS replay
        run: |
          python -m bot.nexus_oos_real_replay_corrected \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT \
            --limit-15m 2500 \
            --output artifacts/nexus_oos_real_replay.json

      - name: Run paired-bootstrap robustness replay
        run: |
          python -m bot.nexus_oos_robustness_replay \
            --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT \
            --limit-15m 2500 \
            --output artifacts/nexus_oos_robustness.json

      - name: Show evidence reports
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('nexus_oos_real_replay.json', 'nexus_oos_robustness.json'):
              path = Path('artifacts') / name
              if not path.exists():
                  print(f'{name}: MISSING')
                  continue
              p = json.loads(path.read_text())
              print(f'===== {name} =====')
              if name == 'nexus_oos_real_replay.json':
                  view = {
                      'status': p.get('status'),
                      'blockers': p.get('blockers'),
                      'report': p.get('report'),
                      'symbols': p.get('symbols'),
                      'methodology': p.get('methodology'),
                  }
              else:
                  view = {
                      'status': p.get('status'),
                      'historical_context_parity_complete': p.get('historical_context_parity_complete'),
                      'symbols': p.get('symbols'),
                      'summary': (p.get('robustness') or {}).get('summary'),
                      'pooled': (p.get('robustness') or {}).get('pooled'),
                      'promotion_authority': p.get('promotion_authority'),
                      'execution_effect': p.get('execution_effect'),
                  }
              print(json.dumps(view, indent=2, sort_keys=True))
          PY

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-oos-real-replay
          path: |
            artifacts/nexus_oos_real_replay.json
            artifacts/nexus_oos_robustness.json
          if-no-files-found: error
