name: Market Language Binance OOS

on:
  pull_request:
    branches: [main, migration/binance-usdm]
    paths:
      - "bot/market_language.py"
      - "bot/market_language_oos.py"
      - "bot/market_language_binance_replay.py"
      - "tests/test_market_language.py"
      - "tests/test_market_language_oos.py"
      - "docs/native_market_language.md"
      - ".github/workflows/market_language_oos.yml"
  workflow_dispatch:

jobs:
  replay:
    name: Binance public market-language evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_TRADE: "true"
      LIVE_TRADING_CONFIRMED: ""
      NEXUS_PILOT_ENABLED: "false"
      EXCHANGE: "binance"
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests for native model and OOS harness
        run: |
          python -m unittest tests.test_market_language -v
          python -m unittest tests.test_market_language_oos -v

      - name: Run read-only Binance USD-M OOS replay
        shell: bash
        run: |
          set +e
          python -m bot.market_language_binance_replay             --symbols BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT             --limit-15m 6000             --warmup 240             --horizon 4             --output artifacts/market_language_binance_oos.json
          code=$?
          set -e
          echo "research_evidence_exit_code=$code"
          test -f artifacts/market_language_binance_oos.json

      - name: Show evidence summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/market_language_binance_oos.json")
          if not path.exists():
              print("market_language_binance_oos.json: MISSING")
              raise SystemExit(1)
          payload = json.loads(path.read_text())
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-language-binance-oos
          path: artifacts/market_language_binance_oos.json
          if-no-files-found: error
